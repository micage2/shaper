<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableView Test</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f0f2f6;
            padding: 20px;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        #status {
            padding: 8px 16px;
            background: #f8faff;
            border-bottom: 1px solid #eef2f7;
            font-size: 13px;
            color: #1c2f44;
            flex-shrink: 0;
        }

        #status .success { color: #16a34a; }
        #status .error { color: #dc2626; }
        #status .info { color: #2563eb; }

        #table-view-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* Log */
        #log {
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 12px;
            max-height: 120px;
            overflow: auto;
            flex-shrink: 0;
        }
        #log .success { color: #4ade80; }
        #log .error { color: #f87171; }
        #log .info { color: #60a5fa; }
        #log .warn { color: #fbbf24; }

        /* TableView Styles - minimal for test */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-bottom: 1px solid #eef2f7;
            background: #fafcff;
            flex-shrink: 0;
            flex-wrap: wrap;
            min-height: 44px;
        }

        .toolbar-left, .toolbar-middle, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .toolbar-middle {
            flex: 1;
            justify-content: center;
        }

        .toolbar-right {
            justify-content: flex-end;
        }

        .table-selector {
            padding: 4px 10px;
            border: 1px solid #dce5ef;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            background: white;
            cursor: pointer;
            outline: none;
            min-width: 120px;
        }

        .table-selector:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .badge-count {
            background: #eef3fa;
            color: #2c4a6e;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .btn {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }
        .btn-success:hover {
            background: #15803d;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-sm {
            padding: 3px 10px;
            font-size: 11px;
        }

        .col-name-input {
            width: 90px;
            padding: 3px 8px;
            border: 1px solid #dce5ef;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }

        .col-type-select,
        .col-target-select {
            width: 90px;
            padding: 3px 8px;
            border: 1px solid #dce5ef;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            background: white;
        }

        .col-target-select {
            display: none;
            width: 100px;
        }

        /* Table styles */
        .table-scroll-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            position: relative;
        }

        .data-table {
            table-layout: fixed;
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
        }

        .data-table thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #f8faff;
            color: #1c2f44;
            font-weight: 600;
            padding: 6px 12px 4px 12px;
            text-align: left;
            border-bottom: 2px solid #dce5ef;
            user-select: none;
            vertical-align: top;
            height: auto;
            min-height: 44px;
        }

        .data-table td {
            padding: 4px 12px;
            border-bottom: 1px solid #edf2f9;
            color: #142433;
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .data-table .col-header-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
            position: relative;
            padding-right: 20px;
        }

        .data-table .col-header-content .col-type {
            font-weight: 400;
            color: #6a7f9b;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #eef3f9;
            padding: 1px 8px;
            border-radius: 10px;
            display: inline-block;
            width: fit-content;
        }

        .data-table .col-header-content .col-name {
            font-weight: 600;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .data-table .col-delete-wrapper {
            position: absolute;
            top: 4px;
            right: 0;
        }

        .data-table .col-delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .data-table thead th:hover .col-delete-btn {
            opacity: 1;
        }

        .data-table .col-delete-btn:hover {
            color: #dc2626;
            background: #fee2e2;
        }

        .data-table .editable-cell {
            cursor: cell;
            position: relative;
        }

        .data-table .cell-content {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-height: 1.2rem;
        }

        .data-table .cell-content .array-badge {
            background: #e7edf8;
            color: #1d3a6f;
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 30px;
            display: inline-block;
            margin: 0 2px 0 0;
            white-space: nowrap;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        .data-table .cell-content .link-badge {
            background: #e5f3e5;
            color: #1b6b3a;
            font-size: 10px;
            padding: 1px 10px;
            border-radius: 30px;
            border: 1px solid #b8d9b8;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
            vertical-align: middle;
        }

        .data-table .cell-content .empty-value {
            color: #94a3b8;
            font-style: italic;
        }

        .data-table .cell-editor {
            font: inherit;
            font-size: 13px;
            padding: 2px 6px;
            border: 2px solid #2563eb;
            border-radius: 4px;
            outline: none;
            background: white;
            width: 100%;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .data-table .cell-editor select {
            appearance: auto;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }

        /* Scrollbar */
        .table-scroll-wrapper::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .table-scroll-wrapper::-webkit-scrollbar-track {
            background: #eef3f9;
            border-radius: 12px;
        }
        .table-scroll-wrapper::-webkit-scrollbar-thumb {
            background: #c4d3e6;
            border-radius: 12px;
        }
        .table-scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a8bbd4;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="status">📊 TableView Test <span id="statusText">— Select a table and test operations</span></div>
        <div id="table-view-container"></div>
        <div id="log">📋 Log</div>
    </div>

    <script type="module">
        import { Model } from './src/model/model.js';
        import { TableView } from './src/view/tableview/tableview.js';

        const model = new Model();

        // Status & log helpers
        const statusText = document.getElementById('statusText');
        const logEl = document.getElementById('log');

        function log(msg, type = 'info') {
            const colors = {
                info: '#60a5fa',
                success: '#4ade80',
                error: '#f87171',
                warn: '#fbbf24'
            };
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<div style="color: ${colors[type] || '#e0e0e0'}">[${time}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function status(msg, type = 'info') {
            const colors = {
                info: '#2563eb',
                success: '#16a34a',
                error: '#dc2626',
                warn: '#f59e0b'
            };
            statusText.innerHTML = `<span style="color: ${colors[type] || '#1c2f44'}">${msg}</span>`;
        }

        // ---- Test Data ----
        log('📦 Building test data...');

        // City
        const cityUuid = model.addTable('City', [
            { name: 'name', type: 'string' },
            { name: 'population', type: 'number' }
        ]);
        const city = model.getTable(cityUuid);
        city.insertRow({ name: 'Dragonhold', population: 12000 });
        city.insertRow({ name: "Baldur's Gate", population: 42000 });
        city.insertRow({ name: 'Neverwinter', population: 23000 });

        // Building
        const buildingUuid = model.addTable('Building', [
            { name: 'name', type: 'string' },
            { name: 'city', type: 'link', targetTable: cityUuid },
            { name: 'type', type: 'string' }
        ]);
        const building = model.getTable(buildingUuid);
        building.insertRow({ name: "Talon's Residence", city: 0, type: 'house' });
        building.insertRow({ name: 'The Rusty Dagger Inn', city: 0, type: 'inn' });
        building.insertRow({ name: 'Temple of the Old Gods', city: 0, type: 'temple' });
        building.insertRow({ name: 'Sorcerous Sundries', city: 1, type: 'shop' });
        building.insertRow({ name: 'The Elfsong Tavern', city: 1, type: 'tavern' });

        // Character
        const charUuid = model.addTable('Character', [
            { name: 'name', type: 'string' },
            { name: 'building', type: 'link', targetTable: buildingUuid },
            { name: 'level', type: 'number' }
        ]);
        const character = model.getTable(charUuid);
        character.insertRow({ name: 'Talon', building: 0, level: 5 });
        character.insertRow({ name: 'Greta', building: 1, level: 4 });
        character.insertRow({ name: 'Ulric', building: 2, level: 6 });
        character.insertRow({ name: 'Eldric', building: 3, level: 3 });
        character.insertRow({ name: 'Silas', building: 4, level: 2 });

        // Weapon
        const weaponUuid = model.addTable('Weapon', [
            { name: 'name', type: 'string' },
            { name: 'damage', type: 'number' },
            { name: 'owner', type: 'link', targetTable: charUuid }
        ]);
        const weapon = model.getTable(weaponUuid);
        weapon.insertRow({ name: "Talon's Bow", damage: 12, owner: 0 });
        weapon.insertRow({ name: "Greta's Axe", damage: 18, owner: 1 });
        weapon.insertRow({ name: "Ulric's Staff", damage: 8, owner: 2 });
        weapon.insertRow({ name: "Eldric's Dagger", damage: 6, owner: 3 });
        weapon.insertRow({ name: "Silas's Shortsword", damage: 10, owner: 4 });
        // Dagger has owner 0 (Talon) to avoid orphans
        weapon.insertRow({ name: 'Dagger', damage: 4, owner: 0 });

        // Armor
        const armorUuid = model.addTable('Armor', [
            { name: 'name', type: 'string' },
            { name: 'protection', type: 'number' },
            { name: 'owner', type: 'link', targetTable: charUuid }
        ]);
        const armor = model.getTable(armorUuid);
        armor.insertRow({ name: "Hunter's Robe", protection: 5, owner: 0 });
        armor.insertRow({ name: 'Chainmail', protection: 8, owner: 1 });
        armor.insertRow({ name: 'Cloak of Shadows', protection: 6, owner: 2 });
        armor.insertRow({ name: 'Mage Robe', protection: 4, owner: 3 });
        armor.insertRow({ name: 'Leather Armor', protection: 7, owner: 4 });

        log(`✅ ${Object.keys(model.tables).length} tables created`, 'success');
        status('Test data loaded. Try switching tables and editing cells.', 'success');

        const container = document.getElementById('table-view-container');
        const tableView = new TableView(container, model);

        // ---- Expose for debugging ----
        window.__testModel = model;
        window.__testTableView = tableView;

        // ---- Model changes log ----
        model.subscribe(() => {
            log('🔄 Model updated', 'info');
            // Update status
            const current = model.getTable(tableView.currentTableUuid);
            if (current) {
                status(`Viewing ${current.name} — ${current.rowCount()} rows, ${current.columns.length} cols`, 'info');
            }
        });
    </script>
</body>
</html>
