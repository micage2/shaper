<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaper</title>
  
  <!-- App styles -->
  <link rel="stylesheet" href="src/view/app-view.css">
  
  <!-- Component styles -->
  <link rel="stylesheet" href="src/view/tableview/tableview.css">
  <link rel="stylesheet" href="src/view/treeview/treeview.css">
  <link rel="stylesheet" href="src/view/treeview/propertyview.css">
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div>
        <h4 id="app_title">Shaper</h4>
        <h6 id="app_title_sub" style="color: grey">shape your data</h6>
       </div>

      <div class="controls">
        <div class="view-tabs">
          <button class="view-tab active" data-view="tree">Tree</button>
          <button class="view-tab" data-view="table">Table</button>
        </div>
        <button class="btn btn-secondary" id="exportBtn">📥 Export</button>
        <button class="btn btn-secondary" id="importBtn">📤 Import</button>
      </div>
    </div>
    
    <div id="split-view">
      <div id="tree-view-container"></div>
      <div id="property-view-container"></div>
      <div id="table-view-container"></div>
    </div>
  </div>
  
  <script type="module" src="src/app.js"></script>
</body>
</html>
